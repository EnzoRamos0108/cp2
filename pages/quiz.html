<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz - Motor Horses</title>
  <link rel="stylesheet" href="../src/css/estilo.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
</head>
<body id="pagina-quiz">
  <header class="header-quiz">
    <img id="logo" src="../src/assets/motor-horses-logo.png" >
    <nav>
      <ul>
        <li><a href="../../index.html">Home</a></li>
        <li><a href="./carros.html">Carros</a></li>
        <li><a href="./sobre.html">Sobre</a></li>
        <li><a href="./quiz.html">Quiz</a></li>
      </ul>
    </nav>
  </header>

  <main id="container-quiz">
    <div class="quiz fade-in">
      <h1>Quiz Motor Horses</h1>
      <section id="container-perguntas">
        <h2 id="pergunta"></h2>
        <div id="container-respostas">
          <input type="text" id="resposta" placeholder="Digite sua resposta...">
        </div>
        <button id="proximo">Próxima Pergunta</button>
        <p id="mensagem"></p>
      </section>

      <section id="container-resultado" class="escondido">
        <h2>Resultado do Quiz</h2>
        <ul id="lista-resultado"></ul>
        <button id="inicio-btn">Reiniciar Quiz</button>
      </section>
    </div>
  </main>

  <!-- CHAMANDO O JS EXTERNO -->
  <script src="../src/js/quiz.js"></script>
</body>
</html>
